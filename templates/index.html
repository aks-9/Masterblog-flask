<!--Delete Route-->
<!--adding a “Delete” button next to each blog post on the index page, and creating a new route to handle the deletion of blog posts.-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Flask Blog</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Welcome to My Flask Blog!</h1>
    {% for post in posts %}
    <div class="post">
        <h2>{{ post.title }}</h2>
        <p><em>Written by {{ post.author }}</em></p>
        <p>{{ post.content }}</p>

        <!--adding a form for a Delete Button-->
        <form action="{{ url_for('delete', post_id=post.id) }}" method="POST" style="display:inline;">
            <button type="submit">Delete</button>
        </form>
        
    </div>
    {% endfor %}
</body>
</html>
